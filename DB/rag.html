<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사내 규정 RAG 검색</title>
    <!-- Supabase 라이브러리 불러오기 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280;
        --line: #e5e7eb; --accent: #3ecf8e; --accent-dark: #24b47e; --cite: #e8f8f0;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Pretendard", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
      main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
      input, button { font: inherit; }
      input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
      input:focus { outline: 2px solid var(--accent); border-color: transparent; }
      button { padding: 10px 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
      button:hover { background: var(--accent-dark); }
      button:disabled { background: #a7dcc3; cursor: wait; }
      button.ghost { background: none; color: var(--muted); padding: 4px 8px; }
      .row { display: flex; gap: 8px; }
      .login .row { flex-direction: column; }
      .user-bar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
      .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .examples span { font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; color: var(--muted); }
      .examples span:hover { border-color: var(--accent); color: var(--accent-dark); }
      .label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
      .answer { line-height: 1.7; white-space: pre-wrap; }
      .cite { background: var(--cite); color: var(--accent-dark); font-size: 12px; font-weight: 600; padding: 1px 5px; border-radius: 4px; }
      .source { border-top: 1px solid var(--line); padding: 10px 0; }
      .source:first-of-type { border-top: none; }
      .source summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
      .source .sim { color: var(--muted); font-size: 13px; white-space: nowrap; }
      .source p { margin: 8px 0 0; font-size: 14px; color: #374151; line-height: 1.6; }
      .hidden { display: none; }
      .error { color: #c62828; }
    </style>
  </head>
  <body>
    <main>
      <h1>🔎 사내 규정 검색</h1>
      <p class="sub">질문을 입력하면 내 문서에서 관련 내용을 찾아 Gemini가 답변합니다.</p>

      <!-- 1. 로그인 -->
      <section id="login-card" class="card login">
        <div class="label">로그인</div>
        <div class="row">
          <input type="email" id="email" placeholder="이메일" />
          <input type="password" id="password" placeholder="비밀번호" />
          <button id="login-btn" onclick="handleLogin()">로그인</button>
        </div>
      </section>

      <!-- 2. 질문 입력 -->
      <section id="ask-card" class="card hidden">
        <div class="user-bar">
          <span id="user-info"></span>
          <button class="ghost" onclick="handleLogout()">로그아웃</button>
        </div>
        <div class="row" style="margin-top: 12px">
          <input id="question" placeholder="예: 연차는 며칠 받을 수 있나요?" />
          <button id="ask-btn" onclick="ask()">질문하기</button>
        </div>
        <div class="examples" id="examples"></div>
      </section>

      <!-- 3. 답변 + 근거 문서 -->
      <section id="answer-card" class="card hidden">
        <div class="label">답변</div>
        <div id="answer" class="answer"></div>
      </section>
      <section id="sources-card" class="card hidden">
        <div class="label">참고한 문서</div>
        <div id="sources"></div>
      </section>
    </main>

    <script>
      const SUPABASE_URL = "https://somiyetvungpiupzktav.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvbWl5ZXR2dW5ncGl1cHprdGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NDAxMzIsImV4cCI6MjEwNzQxNjEzMn0.mNST10jqL_tRf5ty6odHllIYpcf__7iDVcj6UXiG0AU";

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const EXAMPLES = [
        "연차는 며칠 받을 수 있나요?",
        "재택근무는 한 달에 몇 번까지 가능해?",
        "출장 숙박비 한도가 얼마야?",
        "부모님 상을 당하면 휴가와 경조금은?",
        "노트북을 잃어버리면 어디에 신고해?",
        "건강검진 지원 금액 알려줘",
      ];

      const $ = (id) => document.getElementById(id);
      const escapeHtml = (s) =>
        s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      // 로그인 상태에 따라 화면 전환
      function showLoggedIn(user) {
        $("login-card").classList.add("hidden");
        $("ask-card").classList.remove("hidden");
        $("user-info").innerText = `${user.email} 로 로그인됨`;
        $("question").focus();
      }

      function showLoggedOut() {
        $("login-card").classList.remove("hidden");
        ["ask-card", "answer-card", "sources-card"].forEach((id) => $(id).classList.add("hidden"));
      }

      async function handleLogin() {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: $("email").value,
          password: $("password").value,
        });
        if (error) return alert("로그인 실패: " + error.message);
        showLoggedIn(data.user);
      }

      async function handleLogout() {
        await supabaseClient.auth.signOut();
        showLoggedOut();
      }

      // 질문 → Edge Function(embed-chunks)이 검색 + Gemini 답변 생성
      async function ask() {
        const question = $("question").value.trim();
        if (!question) return;

        $("ask-btn").disabled = true;
        $("ask-btn").innerText = "답변 생성 중...";
        $("answer-card").classList.remove("hidden");
        $("sources-card").classList.add("hidden");
        $("answer").innerText = "관련 문서를 찾고 있습니다...";

        // 로그인 세션 토큰이 자동으로 함께 전송됨 → 서버에서 RLS 적용(내 문서만 검색)
        const { data, error } = await supabaseClient.functions.invoke("embed-chunks", {
          body: { question },
        });

        $("ask-btn").disabled = false;
        $("ask-btn").innerText = "질문하기";

        if (error || data?.error) {
          $("answer").innerHTML = `<span class="error">오류: ${escapeHtml(data?.error || error.message)}</span>`;
          return;
        }

        // 답변의 [1], [2] 표시를 강조
        $("answer").innerHTML = escapeHtml(data.answer).replace(/\[(\d+)\]/g, '<span class="cite">$1</span>');
        renderSources(data.sources);
      }

      function renderSources(sources) {
        if (!sources.length) return;
        $("sources").innerHTML = sources
          .map(
            (s, i) => `
            <details class="source">
              <summary>
                <span><span class="cite">${i + 1}</span> ${escapeHtml(s.title)} <small style="color:var(--muted)">(조각 ${s.chunk_index + 1})</small></span>
                <span class="sim">유사도 ${(s.similarity * 100).toFixed(1)}%</span>
              </summary>
              <p>${escapeHtml(s.content)}</p>
            </details>`
          )
          .join("");
        $("sources-card").classList.remove("hidden");
      }

      // 예시 질문 칩, Enter 키 처리
      $("examples").innerHTML = EXAMPLES.map((q) => `<span>${q}</span>`).join("");
      $("examples").addEventListener("click", (e) => {
        if (e.target.tagName !== "SPAN") return;
        $("question").value = e.target.innerText;
        ask();
      });
      $("question").addEventListener("keydown", (e) => e.key === "Enter" && !e.isComposing && ask());
      $("password").addEventListener("keydown", (e) => e.key === "Enter" && handleLogin());

      // 새로고침해도 로그인 유지
      supabaseClient.auth.getSession().then(({ data }) => {
        if (data.session) showLoggedIn(data.session.user);
      });
    </script>
  </body>
</html>

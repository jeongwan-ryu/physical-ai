<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" font-family="Noto Sans CJK KR, Noto Sans CJK TC, Malgun Gothic, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .hw  { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.5 }
      .off { fill:#e0f2fe; stroke:#0284c7; stroke-width:2 }
      .dev { fill:#fff7ed; stroke:#ea580c; stroke-width:2 }
      .orc { fill:#fef2f2; stroke:#dc2626; stroke-width:3 }
      .chip{ fill:#ffffff; stroke:#fdba74; stroke-width:1.2 }
      .t   { font-size:17px; font-weight:700; fill:#0f172a }
      .s   { font-size:13px; fill:#334155 }
      .xs  { font-size:11.5px; fill:#475569 }
      .lb  { font-size:12.5px; fill:#1e293b; font-weight:600 }
      .ln  { fill:none; stroke:#475569; stroke-width:1.8; marker-end:url(#a) }
      .bi  { marker-start:url(#a) }
      .badge { font-size:12px; font-weight:700; fill:#fff }
    </style>
  </defs>
  <rect width="1440" height="1090" fill="#ffffff"/>

  <text x="30" y="44" font-size="26" font-weight="800" fill="#0f172a">Nooki SBC 아키텍처</text>
  <text x="290" y="44" class="s">상자 = Docker 컨테이너 · 화살표 = 주고받는 데이터(ROS 2 토픽)</text>

  <!-- ===== 하드웨어 ===== -->
  <text x="30" y="98" class="lb" fill="#64748b">하드웨어</text>
  <rect class="hw" x="30" y="110" width="200" height="120" rx="10"/>
  <text x="44" y="134" class="t">ESP32-S3</text>
  <text x="44" y="155" class="xs">모터 · 엔코더 · IMU</text>
  <text x="44" y="172" class="xs">범퍼 · 낙하 센서</text>
  <text x="44" y="196" class="xs" fill="#dc2626" font-weight="700">충돌·낙하·통신 끊김 시</text>
  <text x="44" y="212" class="xs" fill="#dc2626" font-weight="700">Pi 없이 혼자 즉시 정지</text>

  <rect class="hw" x="30" y="252" width="200" height="66" rx="10"/>
  <text x="44" y="278" class="t">2D LiDAR</text>
  <text x="44" y="300" class="xs">RPLIDAR C1 · 주변 거리</text>

  <rect class="hw" x="30" y="408" width="200" height="62" rx="10"/>
  <text x="44" y="433" class="t">카메라</text>
  <text x="44" y="454" class="xs">Camera Module 3 Wide</text>

  <rect class="hw" x="30" y="484" width="200" height="52" rx="10"/>
  <text x="44" y="516" class="t">LED 조명</text>

  <rect class="hw" x="30" y="556" width="200" height="62" rx="10"/>
  <text x="44" y="581" class="t">AI HAT+</text>
  <text x="44" y="602" class="xs">Hailo-8L NPU (YOLO 가속)</text>

  <rect class="hw" x="30" y="680" width="200" height="90" rx="10"/>
  <text x="44" y="706" class="t">마이크 · 스피커</text>
  <text x="44" y="728" class="t">시작 버튼</text>
  <text x="44" y="752" class="xs">음성 입력 · 알림음</text>

  <!-- ===== Pi 5 ===== -->
  <rect x="298" y="72" width="845" height="860" rx="18" fill="#fafafa" stroke="#334155" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="316" y="100" class="lb" font-size="15">Raspberry Pi 5 · Docker · ROS 2 Jazzy</text>
  <text x="640" y="100" class="xs">broker 컨테이너 없음 — ROS 2(DDS)는 컨테이너끼리 직접 연결</text>

  <!-- mcu -->
  <rect class="off" x="330" y="120" width="190" height="90" rx="10"/>
  <text x="346" y="146" class="t">mcu</text>
  <text x="346" y="168" class="s">micro-ROS agent</text>
  <text x="346" y="190" class="xs">ESP32 ↔ ROS 연결 다리</text>

  <!-- lidar -->
  <rect class="off" x="330" y="245" width="190" height="80" rx="10"/>
  <text x="346" y="271" class="t">lidar</text>
  <text x="346" y="293" class="s">sllidar_ros2</text>
  <text x="346" y="312" class="xs">스캔 → /scan</text>

  <!-- nav -->
  <rect class="dev" x="600" y="120" width="240" height="205" rx="10"/>
  <rect x="790" y="130" width="40" height="22" rx="11" fill="#ea580c"/><text x="810" y="146" class="badge" text-anchor="middle">B</text>
  <text x="616" y="148" class="t">nav</text>
  <text x="616" y="170" class="s">“어디 있지? 어디로 가지?”</text>
  <text x="616" y="200" class="xs">· SLAM: 방 지도 만들기 + 내 위치</text>
  <text x="616" y="222" class="xs">· Nav2: 장애물 피해 경로 주행</text>
  <text x="616" y="244" class="xs">· 지그재그 탐색 경로 생성</text>
  <text x="616" y="266" class="xs">· URDF/TF: 부품 위치 관계</text>
  <text x="616" y="300" class="xs" fill="#9a3412">slam_toolbox · Nav2</text>

  <!-- camera -->
  <rect class="off" x="330" y="400" width="190" height="135" rx="10" style="fill:#fff7ed;stroke:#ea580c"/>
  <rect x="470" y="410" width="40" height="22" rx="11" fill="#ea580c"/><text x="490" y="426" class="badge" text-anchor="middle">A</text>
  <text x="346" y="428" class="t">camera</text>
  <text x="346" y="450" class="s">Picamera2</text>
  <text x="346" y="472" class="xs">· 1280×720 영상 발행</text>
  <text x="346" y="490" class="xs">· 어두우면 LED 켬</text>
  <text x="346" y="508" class="xs">  (노출×게인 기준)</text>

  <!-- inference -->
  <rect class="dev" x="560" y="400" width="280" height="220" rx="10"/>
  <rect x="790" y="410" width="40" height="22" rx="11" fill="#ea580c"/><text x="810" y="426" class="badge" text-anchor="middle">A</text>
  <text x="576" y="428" class="t">inference</text>
  <text x="576" y="450" class="s">“찾는 물건이 보이나?”</text>
  <text x="576" y="478" class="xs">전처리(타일·대비)</text>
  <text x="576" y="497" class="xs">→ YOLO (Hailo / 예비 NCNN)</text>
  <text x="576" y="516" class="xs">→ 후처리(필터·NMS) → 지도 좌표</text>
  <text x="576" y="535" class="xs">→ 여러 번 보이면 확정</text>
  <text x="576" y="562" class="xs" fill="#15803d" font-weight="700">메모리 부족으로 죽어도</text>
  <text x="576" y="579" class="xs" fill="#15803d" font-weight="700">카메라·주행·안전은 계속 동작</text>
  <text x="576" y="605" class="xs" fill="#9a3412">재사용: lost_item_preprocessing/</text>

  <!-- hmi -->
  <rect class="dev" x="330" y="680" width="190" height="95" rx="10"/>
  <rect x="470" y="690" width="40" height="22" rx="11" fill="#ea580c"/><text x="490" y="706" class="badge" text-anchor="middle">D</text>
  <text x="346" y="706" class="t">hmi</text>
  <text x="346" y="728" class="s">“에어팟 찾아줘”</text>
  <text x="346" y="748" class="xs">whisper.cpp 음성 인식</text>
  <text x="346" y="765" class="xs">버튼 · 알림음</text>

  <!-- mission -->
  <rect class="orc" x="920" y="330" width="210" height="185" rx="12"/>
  <rect x="1080" y="340" width="40" height="22" rx="11" fill="#dc2626"/><text x="1100" y="356" class="badge" text-anchor="middle">E</text>
  <text x="936" y="358" class="t">mission</text>
  <text x="936" y="378" class="xs" fill="#dc2626" font-weight="700">지휘자 (상태머신)</text>
  <text x="936" y="404" class="s">대기 → 탐색 중</text>
  <text x="936" y="424" class="s">→ 찾음 / 실패</text>
  <text x="936" y="452" class="xs">· 3분 지나면 실패 처리</text>
  <text x="936" y="472" class="xs">· 찾으면 정지 + 알림</text>
  <text x="936" y="492" class="xs">· 사진·위치 저장</text>

  <!-- dashboard / web -->
  <rect class="off" x="920" y="680" width="210" height="72" rx="10"/>
  <text x="936" y="706" class="t">dashboard</text>
  <text x="936" y="727" class="s">rosbridge</text>
  <text x="936" y="744" class="xs">웹 ↔ ROS 토픽 번역</text>

  <rect class="dev" x="920" y="790" width="210" height="72" rx="10"/>
  <rect x="1080" y="800" width="40" height="22" rx="11" fill="#ea580c"/><text x="1100" y="816" class="badge" text-anchor="middle">E</text>
  <text x="936" y="816" class="t">web</text>
  <text x="936" y="837" class="s">nginx 정적 페이지</text>
  <text x="936" y="854" class="xs">대시보드 HTML/JS</text>

  <!-- 폰 -->
  <rect class="hw" x="1220" y="700" width="190" height="150" rx="16"/>
  <text x="1236" y="728" class="t">폰 / PC 브라우저</text>
  <text x="1236" y="754" class="xs">· 물건 선택 + 시작</text>
  <text x="1236" y="774" class="xs">· 진행 상황 · 지도</text>
  <text x="1236" y="794" class="xs">· 검출 사진 · 위치</text>
  <text x="1236" y="830" class="xs" fill="#0284c7" font-weight="700">집 안 Wi-Fi만 (영상 외부 전송 X)</text>

  <!-- 계층 막대 -->
  <rect x="330" y="128" width="6" height="74" rx="3" fill="#0f172a"/>
  <rect x="330" y="253" width="6" height="64" rx="3" fill="#0f172a"/>
  <rect x="330" y="408" width="6" height="119" rx="3" fill="#0f172a"/>
  <rect x="330" y="688" width="6" height="79" rx="3" fill="#0f172a"/>
  <rect x="600" y="128" width="6" height="189" rx="3" fill="#16a34a"/>
  <rect x="560" y="408" width="6" height="204" rx="3" fill="#16a34a"/>
  <rect x="920" y="338" width="6" height="169" rx="3" fill="#16a34a"/>
  <rect x="920" y="688" width="6" height="56" rx="3" fill="#16a34a"/>
  <rect x="920" y="798" width="6" height="56" rx="3" fill="#16a34a"/>

  <!-- ===== 화살표 ===== -->
  <!-- 하드웨어 ↔ 컨테이너 -->
  <path class="ln bi" d="M230,165 H330"/><text x="236" y="157" class="xs">USB 시리얼</text>
  <path class="ln" d="M230,285 H330"/><text x="250" y="277" class="xs">USB</text>
  <path class="ln" d="M230,439 H330"/><text x="250" y="431" class="xs">CSI</text>
  <path class="ln bi" d="M230,587 H560"/><text x="248" y="579" class="xs">PCIe</text>
  <path class="ln" d="M330,510 H230"/><text x="248" y="502" class="xs">PWM</text>
  <path class="ln" d="M520,440 H560"/><text x="524" y="432" class="xs">영상</text>
  <path class="ln bi" d="M230,725 H330"/><text x="236" y="717" class="xs">I2S·GPIO</text>

  <!-- mcu/lidar ↔ nav -->
  <path class="ln" d="M520,150 H600"/><text x="560" y="143" class="xs" text-anchor="middle" font-size="10.5">/odom·/imu</text>
  <path class="ln" d="M600,190 H520"/><text x="530" y="208" class="xs">/cmd_vel</text>
  <path class="ln" d="M520,285 H600"/><text x="540" y="277" class="xs">/scan</text>

  <!-- nav → vision -->
  <path class="ln" d="M720,325 V400"/><text x="728" y="360" class="xs">TF: 로봇 위치</text><text x="728" y="376" class="xs">(픽셀→지도 변환용)</text>

  <!-- nav ↔ mission -->
  <path class="ln" d="M840,200 H1025 V330"/><text x="860" y="192" class="xs">지그재그 경로</text>
  <path class="ln" d="M920,375 H860 V290 H840"/><text x="868" y="282" class="xs">주행 명령 / 취소</text>

  <!-- vision → mission -->
  <path class="ln" d="M840,425 H920"/><text x="846" y="417" class="xs">찾았다! +사진</text>

  <!-- hmi ↔ mission -->
  <path class="ln" d="M520,705 H870 V470 H920"/><text x="560" y="697" class="xs">찾을 물건 · 시작/정지</text>
  <path class="ln" d="M920,500 H895 V745 H520"/><text x="560" y="763" class="xs">탐색 중엔 음성 인식 끄기 (CPU 확보)</text>

  <!-- mission ↔ dashboard -->
  <path class="ln bi" d="M1025,515 V680"/><text x="1033" y="590" class="xs">상태 ↔ 물건·시작</text>

  <!-- dashboard/web ↔ 폰 -->
  <path class="ln bi" d="M1130,725 H1220"/><text x="1150" y="717" class="xs">WebSocket</text>
  <path class="ln" d="M1130,825 H1220"/><text x="1162" y="817" class="xs">HTTP</text>

  <!-- ===== 탐색 흐름 ===== -->
  <rect x="30" y="950" width="1380" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="976" class="lb">탐색 한 번의 흐름</text>
  <text x="48" y="1004" class="s">① 음성/웹으로 “에어팟 찾아줘”  →  ② mission이 탐색 시작  →  ③ nav가 지그재그로 방 주행  →  ④ inference가 매 프레임 검사  →  ⑤ 여러 번 보이면 확정, 정지·알림  →  ⑥ 폰에 사진·지도 위치</text>

  <!-- ===== 범례 ===== -->
  <g transform="translate(30,1045)">
    <rect class="hw" width="22" height="16" rx="4"/><text x="30" y="13" class="xs">하드웨어 / 외부 기기</text>
    <rect class="off" x="170" width="22" height="16" rx="4"/><text x="200" y="13" class="xs">기성 이미지 (설정만)</text>
    <rect class="dev" x="340" width="22" height="16" rx="4"/><text x="370" y="13" class="xs">직접 개발 (A~E = 담당자)</text>
    <rect class="orc" x="530" width="22" height="16" rx="4"/><text x="560" y="13" class="xs">지휘 컨테이너</text>
    <rect x="680" y="0" width="6" height="16" rx="3" fill="#0f172a"/><text x="694" y="13" class="xs">장치 접근 · 죽으면 안 됨 · restart: always</text>
    <rect x="960" y="0" width="6" height="16" rx="3" fill="#16a34a"/><text x="974" y="13" class="xs">권한 최소 · 죽어도 됨 · on-failure + mem_limit</text>
    <text x="1260" y="13" class="xs">ESP32 펌웨어 = C</text>
  </g>
</svg>
